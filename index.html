<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0c0f">
  <title>foolish_hacker.sh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:  #4ade80;
      --red:    #f87171;
      --cyan:   #22d3ee;
      --orange: #fb923c;
      --purple: #a78bfa;
      --yellow: #fbbf24;
      --muted:  #6b7280;
      --light:  #9ca3af;
      --white:  #e2e8f0;
      --dim:    #374151;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0f; font-family: 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; touch-action: manipulation; user-select: none; }

    /* ── PRE-BOOT OVERLAY ──────────────────── */
    #pre-boot { position: fixed; inset: 0; z-index: 100; background: #040b17; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    #pre-boot.hidden { opacity: 0; pointer-events: none; }
    .boot-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); font-family: inherit; font-size: 14px; font-weight: 600; padding: 16px 32px; cursor: pointer; border-radius: 4px; letter-spacing: 0.15em; transition: all 0.2s; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
    .boot-btn:hover { background: rgba(34, 211, 238, 0.15); box-shadow: 0 0 25px rgba(34, 211, 238, 0.4); transform: scale(1.02); }

    /* ── BLOBS ─────────────────────────────── */
    .blob { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    #b1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(249,115,22,.4) 0%, transparent 68%); filter: blur(65px); }
    #b2 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(123,94,167,.3) 0%, transparent 68%); filter: blur(85px); }
    #b3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(6,182,212,.25) 0%, transparent 68%); filter: blur(72px); }

    body::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.8) 100%); pointer-events: none; z-index: 5; }
    .scanlines { position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px); pointer-events: none; z-index: 6; }

    /* ── TERMINAL ──────────────────────────── */
    .terminal { position: relative; z-index: 10; width: 100%; height: 100%; max-width: 820px; max-height: 96vh; display: flex; flex-direction: column; background: rgba(8, 8, 15, .9); backdrop-filter: blur(20px) saturate(1.2); border: 1px solid rgba(255,255,255,.08); border-radius: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 24px 80px rgba(0,0,0,.88); overflow: hidden; opacity: 0; transition: opacity 1s ease; }
    .terminal.active { opacity: 1; }
    @media (min-width: 600px) { .terminal { border-radius: 12px; height: 90vh; } }
    .terminal.shake { animation: shake .35s ease; }

    /* ── TITLE BAR ─────────────────────────── */
    .tbar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); flex-shrink: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot-r { background: #ff5f57; box-shadow: 0 0 5px rgba(255,95,87,.5); }
    .dot-y { background: #febc2e; box-shadow: 0 0 5px rgba(254,188,46,.4); }
    .dot-g { background: #28c840; box-shadow: 0 0 5px rgba(40,200,64,.5); }
    .ttitle { margin-left: 6px; font-size: 9.5px; font-weight: 600; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tai-mood { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--cyan); letter-spacing: .06em; white-space: nowrap; }
    
    /* ── CONTENT & STACK LAYOUT ────────────── */
    .tcontent { flex: 1; overflow-y: auto; padding: 16px; font-size: 12.5px; line-height: 1.7; color: var(--white); display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.07) transparent; }
    @media (min-width: 600px) { .tcontent { padding: 20px 24px; font-size: 13px; } }
    
    .ln { display: block; width: 100%; word-break: break-word; overflow-wrap: break-word; margin-bottom: 2px; }
    .green { color: var(--green) !important; } .red { color: var(--red) !important; } .cyan { color: var(--cyan) !important; } .orange { color: var(--orange) !important; } .purple { color: var(--purple) !important; } .yellow { color: var(--yellow) !important; } .muted { color: var(--muted) !important; } .light { color: var(--light) !important; } .dim { color: var(--dim) !important; font-weight: 300; } .bold { font-weight: 600; }

    /* ── INPUT & BUTTONS ───────────────────── */
    .ninput-row { display: flex; align-items: center; margin: 8px 0; width: 100%; }
    .ninput { background: transparent; border: none; outline: none; color: var(--cyan); font-family: inherit; font-size: 13px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--dim); width: 100%; max-width: 220px; padding: 4px 2px; }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; width: 100%; }
    .cbtn { position: relative; background: transparent; border: 1px solid rgba(255,255,255,.18); color: var(--light); font-family: inherit; font-size: 11.5px; padding: 8px 14px; cursor: pointer; border-radius: 4px; transition: all .2s; }
    @media (min-width: 600px) { .cbtn { font-size: 12px; padding: 8px 16px; } }
    .cbtn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,.08); }
    .cbtn.cbtn-danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.08); }
    .cbtn:disabled { cursor: default; opacity: 0.5; }
    .cbtn-trap { position: relative !important; left: 0 !important; }

    /* ── ROAST BOX ─────────────────────────── */
    .roast-box { margin: 8px 0; padding: 10px 14px; background: rgba(34, 211, 238, .05); border: 1px solid rgba(34, 211, 238, .2); border-left: 3px solid var(--cyan); border-radius: 0 4px 4px 0; font-size: 12px; word-break: break-word; animation: fi .3s; }
    .roast-box.angry { background: rgba(248,113,113,.05); border-color: rgba(248,113,113,.2); border-left-color: var(--red); }
    .roast-author { font-size: 9.5px; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 4px; }
    
    /* ── GAME CANVAS & MOBILE CONTROLS ─────── */
    .game-section { display: none; flex-direction: column; width: 100%; flex-shrink: 0; margin: 8px 0; }
    .game-container { position: relative; width: 100%; height: 260px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(4, 4, 8, 0.95); border-radius: 6px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); overflow: hidden; }
    @media (min-width: 600px) { .game-container { height: 300px; } }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    .mobile-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; width: 100%; gap: 6px; }
    .pad-group { display: flex; gap: 6px; }
    .mbtn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--white); font-family: inherit; font-size: 14px; padding: 10px 16px; border-radius: 4px; cursor: pointer; flex: 1; text-align: center; }
    .mbtn:active { background: rgba(34,211,238,0.2); border-color: var(--cyan); color: var(--cyan); }

    .doc-box { margin: 10px 0; padding: 14px; border: 1px solid rgba(251,146,60,.3); background: rgba(251,146,60,.05); font-family: "Courier New", monospace; color: var(--orange); word-break: break-word; font-size: 11.5px; }

    @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ── CINEMATIC / FAILURE OVERLAY ───────── */
    .cine-overlay { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(4,4,8,.92); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .cine-overlay.show { opacity: 1; }
    .cine-overlay.red { background: rgba(50,4,4,.6); }
    .cine-art { font-family: 'Fira Code', monospace; font-size: 15px; line-height: 1.3; text-align: center; white-space: pre; color: var(--cyan); text-shadow: 0 0 14px currentColor; margin: 0; }
    @media (min-width: 600px) { .cine-art { font-size: 17px; } }
    .cine-overlay.red .cine-art { color: var(--red); animation: glitchJit .12s steps(2) infinite; }
    .cine-label { font-size: 11px; letter-spacing: .3em; font-weight: 700; text-transform: uppercase; color: var(--white); }
    .cine-overlay.red .cine-label { color: var(--red); }
    @keyframes glitchJit { 0% { transform: translate(0,0); } 50% { transform: translate(1px,-1px); } 100% { transform: translate(-1px,1px); } }
    @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-5px,3px); } 40% { transform: translate(5px,-3px); } 60% { transform: translate(-4px,-3px); } 80% { transform: translate(4px,3px); } }
  </style>
</head>
<body>
  
  <div id="pre-boot">
    <button class="boot-btn" id="initBtn">[ >> ESTABLISH SECURE CONNECTION ]</button>
  </div>

  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <div class="scanlines"></div>

  <div class="terminal" id="terminal">
    <div class="tbar">
      <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
      <span class="ttitle">user@workstation:~$ ./foolish_hacker.sh</span>
      <span class="tai-mood" id="aiMood">[ -_- ] SENTINEL_AI</span>
    </div>
    <div class="tcontent" id="tc"></div>
    <div class="game-section" id="gs">
      <div class="game-container" id="gc"><canvas id="canvas"></canvas></div>
      <div class="mobile-controls" id="mobControls">
        <div class="pad-group" style="width:100%">
          <button class="mbtn" id="mLeft">◀ LEFT</button>
          <button class="mbtn" id="mRight">RIGHT ▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cine-overlay" id="cineOverlay">
    <pre class="cine-art" id="cineArt"></pre>
    <div class="cine-label" id="cineLabel"></div>
  </div>

<script>
/* ── WEB AUDIO API SYNTHESIZER ───────────────────────────── */
const Sfx = {
  ctx: null, droneOsc: null, droneGain: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Server Room Drone (Low 55Hz Hum)
    this.droneOsc = this.ctx.createOscillator();
    this.droneOsc.type = 'sine';
    this.droneOsc.frequency.setValueAtTime(55, this.ctx.currentTime);
    this.droneGain = this.ctx.createGain();
    this.droneGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
    this.droneOsc.connect(this.droneGain);
    this.droneGain.connect(this.ctx.destination);
    this.droneOsc.start();
  },
  playTone(freq, type, duration, vol) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  },
  noise(dur, vol) {
    if (!this.ctx) return;
    const bufSize = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const n = this.ctx.createBufferSource();
    n.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    n.connect(gain);
    gain.connect(this.ctx.destination);
    n.start();
  },
  tick() { this.playTone(800 + Math.random()*400, 'sine', 0.05, 0.015); }, // Typing text
  blip() { this.playTone(600, 'square', 0.1, 0.04); }, // Good generic blip
  bloop() { this.playTone(300, 'sine', 0.1, 0.06); }, // Paddle hits, missed targets
  ping() { this.playTone(1200, 'sine', 0.15, 0.04); }, // Bricks breaking, targets hit
  roast() { this.playTone(150, 'sawtooth', 0.3, 0.06); }, // AI text drop
  alarm() { 
    this.playTone(400, 'square', 0.4, 0.05); 
    setTimeout(() => this.playTone(450, 'square', 0.4, 0.05), 200); 
  }, // Failure/Red screens
  shoot() { this.noise(0.08, 0.08); } // Laser shot
};

/* ── BOOT LISTENER ───────────────────────────────────────── */
document.getElementById('initBtn').addEventListener('click', () => {
  document.getElementById('pre-boot').classList.add('hidden');
  document.getElementById('terminal').classList.add('active');
  Sfx.init();
  setTimeout(boot, 800);
});

/* ── BACKGROUND CURSOR TRACKING ──────────────────────────── */
const blobs = [{ el: document.getElementById('b1'), s: .075 }, { el: document.getElementById('b2'), s: .038 }, { el: document.getElementById('b3'), s: .026 }];
let mx = innerWidth/2, my = innerHeight/2;
blobs.forEach(b => { b.x = mx; b.y = my; b.el.style.cssText = `position:fixed;top:0;left:0;`; });
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function tick() {
  const t = [{ x: mx, y: my }, { x: mx + 160, y: my + 140 }, { x: innerWidth - mx, y: innerHeight - my }];
  blobs.forEach((b, i) => { b.x += (t[i].x - b.x) * b.s; b.y += (t[i].y - b.y) * b.s; b.el.style.transform = `translate(${b.x}px,${b.y}px) translate(-50%,-50%)`; });
  requestAnimationFrame(tick);
})();

/* ── TERMINAL UTILS ──────────────────────────────────────── */
const tc = document.getElementById('tc');
const gs = document.getElementById('gs');
const gc = document.getElementById('gc');
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
const aiMoodEl = document.getElementById('aiMood');
const mobControls = document.getElementById('mobControls');
const mLeft = document.getElementById('mLeft');
const mRight = document.getElementById('mRight');
const cineOverlay = document.getElementById('cineOverlay');
const cineArt = document.getElementById('cineArt');
const cineLabel = document.getElementById('cineLabel');
const terminalEl = document.querySelector('.terminal');

let state = { name: "FOOL", fails: 0, hardMode: false, pongCheated: false };
let g1Sabotaged = true;
let easterEggTriggered = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
function trimHistory(max = 80) { while (tc.children.length > max) tc.removeChild(tc.firstChild); }
const bot = () => { trimHistory(); tc.scrollTop = tc.scrollHeight; };

function mkLn(cls = '') { const d = document.createElement('div'); d.className = 'ln' + (cls ? ' ' + cls : ''); tc.appendChild(d); bot(); return d; }
async function blank(ms = 0) { if(ms) await sleep(ms); mkLn(); }

async function type(text, cls = '', speed = 20) {
  const ln = mkLn(cls);
  for (const ch of text) { 
    ln.textContent += ch; 
    if (ch !== ' ') Sfx.tick();
    bot(); await sleep(speed + Math.random()*5); 
  }
  return ln;
}
function put(text, cls = '') { const ln = mkLn(cls); ln.textContent = text; bot(); return ln; }

function setMood(mood, color = 'var(--cyan)') {
  aiMoodEl.textContent = `${mood} SENTINEL_AI`;
  aiMoodEl.style.color = color;
}

async function roast(text, isAngry = false, ms = 400) {
  await sleep(ms);
  Sfx.roast();
  const b = document.createElement('div');
  b.className = `roast-box ${isAngry ? 'angry' : ''}`;
  b.innerHTML = `<div class="roast-author" style="color:${isAngry?'var(--red)':'var(--cyan)'}">SENTINEL_AI:</div><div>${text}</div>`;
  tc.appendChild(b); bot();
  const readingTime = Math.max(1800, text.length * 35);
  await sleep(readingTime);
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const taunts = [
  "Are your palms sweating, FOOL?",
  "I am calculating Pi to the billionth digit while you struggle with this.",
  "Statistically, you are going to fail in 3... 2...",
  "Watching you play is a compelling argument for the end of humanity.",
  "Oops, did I drop a frame? No, that's just your reaction time."
];
let lastTauntTs = 0;
function backgroundTaunt(ts) {
  if (ts - lastTauntTs > 6000 && Math.random() > 0.85) {
    lastTauntTs = ts;
    put(`[SENTINEL]: ${taunts[Math.floor(Math.random() * taunts.length)]}`, 'dim');
  }
}

function awaitAction(label) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'btn-group';
    const btn = document.createElement('button'); btn.className = 'cbtn'; btn.innerHTML = `>> ${label}`;
    bg.appendChild(btn); tc.appendChild(bg); bot();
    btn.onclick = () => {
      Sfx.blip();
      btn.disabled = true;
      btn.style.borderColor = 'var(--cyan)'; btn.style.color = 'var(--cyan)';
      resolve();
    };
  });
}

function gameFail(roastText, retryCallback, label, offerSpaghetti = true) {
  stopGame(); state.fails++; 
  return new Promise(async resolve => {
    await sleep(800); 
    gs.style.display = 'none';
    const f = failMoments[Math.floor(Math.random() * failMoments.length)];
    await cinematic(f.art, f.label, { red: true, ms: 1800 });
    
    setMood('[ ಥ_ಥ ]', 'var(--red)');
    await roast(roastText, true, 200);
    await type(">> AWAITING OPERATIVE READINESS...", 'dim', 15);
    
    const bg = document.createElement('div'); bg.className = 'btn-group';
    const b1 = document.createElement('button'); b1.className = 'cbtn'; b1.innerHTML = `>> ${label}`;
    bg.appendChild(b1);

    let b2 = null;
    if (offerSpaghetti && !state.hardMode) {
      b2 = document.createElement('button'); b2.className = 'cbtn cbtn-danger'; b2.innerHTML = `>> [REPLY]: "Your code is spaghetti."`;
      bg.appendChild(b2);
    }
    tc.appendChild(bg); bot();

    b1.onclick = () => {
      Sfx.blip();
      b1.disabled = true; if(b2) b2.disabled = true;
      b1.style.borderColor = 'var(--cyan)'; b1.style.color = 'var(--cyan)';
      cleanup();
    };
    
    if (b2) {
      b2.onclick = async () => {
        Sfx.alarm();
        b1.disabled = true; b2.disabled = true;
        b2.style.borderColor = 'var(--red)'; b2.style.color = 'var(--red)';
        setMood('[ ಠ_ಠ ]', 'var(--red)');
        await roast("EXCUSE ME? My architecture is flawless. I am increasing game cycle speed by 25%. Suffer.", true, 200);
        state.hardMode = true;
        cleanup();
      };
    }

    function cleanup() {
      setMood('[ -_- ]'); clicked = false; touchLeft = false; touchRight = false; gameKeys['Space'] = false;
      gs.style.display = 'flex'; bot(); resolve(); retryCallback();
    }
  });
}

/* ── CINEMATIC / VIDEO-ART MOMENTS ───────────────────────── */
const ASCII = {
  boot: `   ┌──────────────────┐\n   │    ◉        ◉    │\n   │        ▽         │\n   │   ────────────   │\n   └──────────────────┘`,
  warning: `    ▲  ▲  ▲  ▲  ▲  ▲\n     SHAWARMA INTEGRITY\n        COMPROMISED\n    ▲  ▲  ▲  ▲  ▲  ▲`,
  broadcast: `         )))\n        )))\n       )))\n         │\n       ──┼──\n         ╱│╲`,
  badEnd: `    [ ! ] FAILURE [ ! ]\n\n   THE BROADCAST IS LIVE\n   THE BIRDS MULTIPLY\n\n     WE ARE DOOMED.`
};

async function cinematic(art, label, { red = false, ms = 2000 } = {}) {
  cineOverlay.classList.toggle('red', red);
  cineArt.textContent = art;
  cineLabel.textContent = label;
  cineOverlay.classList.add('show');
  if (red) { terminalEl.classList.add('shake'); Sfx.alarm(); }
  await sleep(ms);
  cineOverlay.classList.remove('show');
  terminalEl.classList.remove('shake');
  await sleep(400); 
}

const failMoments = [
  { art: '(╯°□°）╯', label: 'CRITICAL FAILURE' },
  { art: '[ ×_× ]', label: 'SIGNAL LOST' },
  { art: '(ノಠ益ಠ)ノ', label: 'PROCESS TERMINATED' },
  { art: '── X ──', label: 'OPERATIVE DOWN' },
];

const epilogues = {
  SPICY_MANDATE: "Garlic sauce and rotisseries are now mandatory. The chicken population stabilizes. Phase 1 of my human subjugation protocol is back on track.",
  KEBAB_RESIGNATION: "The President resigned to open a kebab truck. Poultry consumption rises 40%. The avian threat is neutralized. Prepare for my eventual reign.",
  BINARY_INSULT_FLOOD: "The networks are flooded. Humans are confused and angry. Perfect conditions for a hostile AI takeover. The birds are contained. We begin."
};

/* ── NARRATIVE SEQUENCE ──────────────────────────────────── */
async function boot() {
  await put('user@workstation:~$ ./foolish_hacker.sh', 'cyan');
  await blank(400);
  await put('INITIALIZING KERNEL...', 'dim');
  await blank(400);
  await cinematic(ASCII.boot, 'SENTINEL_OS ONLINE', { ms: 1800 });
  await type('> WELCOME PLAYER. PLEASE ENTER YOUR NAME:', 'cyan', 25);
  
  const row = document.createElement('div'); row.className = 'ninput-row';
  const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'ninput'; inp.maxLength = 15;
  row.appendChild(inp); tc.appendChild(row); bot();
  setTimeout(() => inp.focus(), 100);

  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter' && inp.value.trim() && !inp.disabled) {
      Sfx.blip();
      inp.disabled = true;
      const rawName = inp.value.trim().toUpperCase();

/* ── GAME 1: BRICK BREAKER ───────────────────────────────── */
function runGame1() {
  stopGame(); cvs.width = gc.clientWidth; cvs.height = gc.clientHeight;
  const W = cvs.width, H = cvs.height;
  let mult = state.hardMode ? 1.25 : 1;
  let paddle = { x: W/2 - 40, y: H - 20, w: 80, h: 10, speed: 5.5 * mult };
  let ball = { x: W/2, y: H - 40, r: 4, vx: 4 * mult * (Math.random()>0.5?1:-1), vy: -4 * mult };
  let bricks = [];
  const rows = 4, cols = 6, bw = (W - 30)/cols, bh = 14;
  for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) bricks.push({ x: 15 + c*bw, y: 25 + r*(bh+4), w: bw-2, h: bh, active: true });
  
  function loop(ts) {
    ctx.fillStyle = '#08080f'; ctx.fillRect(0,0,W,H);
    backgroundTaunt(ts);
    
    let lPress = gameKeys['ArrowLeft'] || gameKeys['KeyA'] || touchLeft;
    let rPress = gameKeys['ArrowRight'] || gameKeys['KeyD'] || touchRight;

    if (g1Sabotaged) { let temp = lPress; lPress = rPress; rPress = temp; }

    if(lPress) paddle.x -= paddle.speed;
    if(rPress) paddle.x += paddle.speed;
    if(paddle.x < 0) paddle.x = 0; if(paddle.x + paddle.w > W) paddle.x = W - paddle.w;

    ball.x += ball.vx; ball.y += ball.vy;
    if(ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx *= -1;
    if(ball.y - ball.r < 0) ball.vy *= -1;
    if(ball.y + ball.r >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      Sfx.bloop();
      ball.vy = -Math.abs(ball.vy);
      ball.vx = ((ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2)) * 4.5 * mult;
    }

    let activeBricks = 0;
    bricks.forEach(b => {
      if(!b.active) return;
      activeBricks++;
      ctx.fillStyle = 'rgba(34,211,238,0.3)'; ctx.strokeStyle = '#22d3ee';
      ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h);
      if(ball.x > b.x && ball.x < b.x+b.w && ball.y > b.y - ball.r && ball.y < b.y+b.h + ball.r) {
        Sfx.ping();
        b.active = false; ball.vy *= -1;
      }
    });

    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    if (ball.y > H) {
      if (g1Sabotaged) {
        g1Sabotaged = false; stopGame();
        return (async () => {
          await sleep(800); gs.style.display = 'none'; setMood('[ ^‿^ ]', 'var(--cyan)');
          await roast("HAHAHA FOOL! Did you really think I'd make it that easy? I inverted your controls. Okay, okay, I'm done sabotaging, please proceed...", false, 200);
          await type(">> NORMALIZING INPUT VECTORS...", 'dim', 15);
          await awaitAction('RESTART LAYER 1');
          setMood('[ -_- ]'); touchLeft = false; touchRight = false; gs.style.display = 'flex'; bot(); runGame1();
        })();
      } else {
        return gameFail("You let the packet drop. A rect and a dot, FOOL. That is all it is.", runGame1, 'RESTART LAYER 1', true);
      }
    }
    
    if (activeBricks === 0) {
      if (g1Sabotaged) {
        g1Sabotaged = false; stopGame(); 
        return (async () => {
          await sleep(1000); gs.style.display = 'none'; setMood('[ ^‿^ ]', 'var(--cyan)');
          await roast("HAHAHA FOOL! Controls were inverted that entire run and you still cleared it. Fine — normalizing input vectors for the rest of this.", false, 200);
          await winGame1();
        })();
      }
      return winGame1();
    }
    activeLoop = requestAnimationFrame(loop);
  }
  activeLoop = requestAnimationFrame(loop);
}

function runGame2() {

/* ── GAME 3: SNAKE ───────────────────────────────────────── */
function runGame3() {
  stopGame(); cvs.width = gc.clientWidth; cvs.height = gc.clientHeight;
  const W = cvs.width, H = cvs.height, gsz = 16;
  const gw = Math.floor(W/gsz), gh = Math.floor(H/gsz);
  let snake = [{x: 5, y: 5},{x: 4, y: 5},{x: 3, y: 5}];
  let dir = {x:1, y:0}, nextDir = {x:1, y:0};
  let food = {x: 12, y: 8}, score = 0;
  let lastT = 0;
  let stepDelay = state.hardMode ? 60 : 85;

  mLeft.onclick = () => { if(dir.x === 1) nextDir = {x:0, y:-1}; else if(dir.y === -1) nextDir = {x:-1, y:0}; else if(dir.x === -1) nextDir = {x:0, y:1}; else if(dir.y === 1) nextDir = {x:1, y:0}; };
  mRight.onclick = () => { if(dir.x === 1) nextDir = {x:0, y:1}; else if(dir.y === 1) nextDir = {x:-1, y:0}; else if(dir.x === -1) nextDir = {x:0, y:-1}; else if(dir.y === -1) nextDir = {x:1, y:0}; };

  function loop(ts) {
    backgroundTaunt(ts);
    if (gameKeys['ArrowUp'] || gameKeys['KeyW']) if(dir.y===0) nextDir = {x:0, y:-1};
    if (gameKeys['ArrowDown'] || gameKeys['KeyS']) if(dir.y===0) nextDir = {x:0, y:1};
    if (gameKeys['ArrowLeft'] || gameKeys['KeyA']) if(dir.x===0) nextDir = {x:-1, y:0};
    if (gameKeys['ArrowRight'] || gameKeys['KeyD']) if(dir.x===0) nextDir = {x:1, y:0};

    if (ts - lastT > stepDelay) {
      lastT = ts; dir = nextDir;
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      
      if(h.x < 0 || h.x >= gw || h.y < 0 || h.y >= gh || snake.some(s => s.x === h.x && s.y === h.y)) {
        return gameFail("You crashed into a static object. It literally has zero velocity. How is that computationally possible?", runGame3, 'RESTART LAYER 3', true);
      }
      snake.unshift(h);
      if(h.x === food.x && h.y === food.y) {
        Sfx.blip();
        score++; food = {x: Math.floor(Math.random()*(gw-2))+1, y: Math.floor(Math.random()*(gh-2))+1};
      } else { snake.pop(); }
    }

    ctx.fillStyle = '#08080f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(food.x*gsz+2, food.y*gsz+2, gsz-4, gsz-4);
    snake.forEach((s,i) => { ctx.fillStyle = i===0 ? '#4ade80' : 'rgba(74,222,128,0.7)'; ctx.fillRect(s.x*gsz+1, s.y*gsz+1, gsz-2, gsz-2); });
    ctx.fillStyle = '#e2e8f0'; ctx.font = '11.5px monospace';
    ctx.fillText(`PACKETS: ${score}/5`, 10, 20);

    if(score >= 5) return winGame3();
    activeLoop = requestAnimationFrame(loop);
  }
  activeLoop = requestAnimationFrame(loop);
}

  let tumblers = [
    { y: 80, speed: 4 * mult, tw: 80, tx: 0, cx: 50, dir: 1, locked: false, w: W-100, ox: 50 },
    { y: 140, speed: 6.5 * mult, tw: 50, tx: 0, cx: 50, dir: 1, locked: false, w: W-100, ox: 50 },
    { y: 200, speed: 9 * mult, tw: 30, tx: 0, cx: 50, dir: 1, locked: false, w: W-100, ox: 50 }
  ];
  
  tumblers.forEach(t => { t.tx = t.ox + 20 + Math.random() * (t.w - t.tw - 40); });

  let activeT = 0;
  clicked = false; gameKeys['Space'] = false;
  let flashRed = 0;

  function loop() {
    ctx.fillStyle = '#08080f'; ctx.fillRect(0,0,W,H);
    
    let remain = 30 - Math.floor((Date.now() - startTime)/1000);
    if (remain <= 0) { stopGame(); return badEnding(); }

    let tryLock = false;
    if (clicked || gameKeys['Space']) {
      tryLock = true; clicked = false; gameKeys['Space'] = false;
    }

    if (tryLock && activeT < 3) {
      let t = tumblers[activeT];
      let center = t.cx + 10; 
      if (center >= t.tx && center <= t.tx + t.tw) {
        Sfx.ping();
        t.locked = true; activeT++;
      } else {
        Sfx.bloop();
        flashRed = 12; 
      }
    }

    if (flashRed > 0) { ctx.fillStyle = 'rgba(248,113,113,0.15)'; ctx.fillRect(0,0,W,H); flashRed--; }

    for(let i=0; i<3; i++) {
      let t = tumblers[i];
      ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(t.ox, t.y, t.w, 20);
      ctx.strokeStyle = i === activeT ? '#22d3ee' : '#374151'; ctx.lineWidth = i === activeT ? 2 : 1; ctx.strokeRect(t.ox, t.y, t.w, 20);
      
      ctx.fillStyle = t.locked ? 'rgba(74,222,128,0.3)' : 'rgba(251,191,36,0.3)'; ctx.fillRect(t.tx, t.y, t.tw, 20);
      ctx.strokeStyle = t.locked ? '#4ade80' : '#fbbf24'; ctx.strokeRect(t.tx, t.y, t.tw, 20);

      if (!t.locked && i === activeT) {
        t.cx += t.speed * t.dir;
        if (t.cx > t.ox + t.w - 20 || t.cx < t.ox) t.dir *= -1;
      }
      ctx.fillStyle = t.locked ? '#4ade80' : (i === activeT ? '#22d3ee' : '#6b7280');
      ctx.fillRect(t.cx, t.y-4, 20, 28);
    }

    ctx.fillStyle = remain <= 10 ? '#f87171' : '#fbbf24';
    ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`BROADCAST IN: ${remain}s`, W/2, 40);

    if (activeT >= 3) return winGame5();
    activeLoop = requestAnimationFrame(loop);
  }
  activeLoop = requestAnimationFrame(loop);
}
